name: Build and publish signed update
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Require release signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Configure the four signing secrets described in README.md.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/binnder.jks"
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 2))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.1.$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"
      - name: Test and build signed APK
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/binnder.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease assembleRelease
      - name: Prepare update manifest
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/binnder.apk
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('dist/binnder.apk')
          manifest={'versionCode':int(os.environ['VERSION_CODE']),'versionName':os.environ['VERSION_NAME'],'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          pathlib.Path('dist/update.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" dist/binnder.apk dist/update.json --target "$GITHUB_SHA" --title "Binnder $VERSION_NAME" --generate-notes --latest
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/binnder.jks"
