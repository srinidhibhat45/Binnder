name: Build Google Play bundle
on:
  push:
    tags: ['play-v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown on Google Play (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure the signing secrets described in README.md.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/binnder.jks"
          # Play version codes must strictly increase for every upload.
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          NAME="${{ inputs.version_name }}"
          [ -n "$NAME" ] || NAME="${GITHUB_REF_NAME#play-v}"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
      - name: Test and build signed Play bundle
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/binnder.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testPlayReleaseUnitTest lintPlayRelease bundlePlayRelease
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "binnder-play-$VERSION_NAME-$VERSION_CODE.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: binnder-play-aab
          path: binnder-play-*.aab
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/binnder.jks"
